<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Memorama 🧠</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="contenedor">
    <h1>🧠 Memorama</h1>
    <div class="marcador">
      <span>Intentos: <strong id="intentos">0</strong></span>
      <span>Parejas: <strong id="parejas">0</strong> / <strong id="total-parejas">8</strong></span>
      <button id="btn-reiniciar">🔄 Reiniciar</button>
    </div>
    <div class="tablero" id="tablero"></div>
    <div class="mensaje-victoria" id="mensaje-victoria" hidden>
      <p>🎉 ¡Ganaste en <span id="intentos-final"></span> intentos!</p>
      <button id="btn-jugar-de-nuevo">Jugar de nuevo</button>
    </div>
  </div>
  <script src="script.js"></script>
</body>
</html>
